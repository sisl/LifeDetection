evaluations:
  wandb: true
  policy: "SARSOP" # "CONOPS" "GREEDY" "SARSOP
  threshold_high: [0.999] # CONOPS ONLY
  threshold_low: [0.001] # CONOPS ONLY
  verbose: true
  policy_load: false
  episodes: 3
  proj_name: "test" # "CONOPS_test-H_$(threshold_high)-L_$(threshold_low)"
  work_dir: "testing/solve1_2tau" # TODO: Set to meaningful name to play around


parameters:
  lambda: [0.995] #[0.5, 0.6, 0.7, 0.8, 0.9, 1.0]
  tau: [0.9] #[0.5, 0.6, 0.7, 0.8, 0.9, 1.0]
  gamma: [0.9]

# add in off nominal nominal testing later:

scenario:
  acc_rate: 3
  std_acc_rate: 0.5 # different values (e.g. 0.1, 0.25, 0.33) adds variability in sample accumulation behavior
  sample_Max_Chamber: 100
  pomdp: true # always keep true no momdps
